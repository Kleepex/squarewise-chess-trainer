name: Deploy Squarewise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the public static app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app-advanced.js cloud-sync.js squarewise-config.js _site/
          cp -R vendor _site/vendor
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app-advanced.js
          test -s _site/squarewise-config.js
          test -s _site/vendor/chess/chess.mjs
          test -s _site/vendor/stockfish/stockfish-19-lite-single.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
