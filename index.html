<style>

<script>
(() => {

  ];
  const defaultStudies = [
    {id:'study-1',type:'Endgame · 8 min',title:'The active king in rook endings',description:'A practical reminder: activity matters more than pawn counting.',note:'Bring the king toward the action before pushing the passer.',updated:'Starter note'},
    {id:'study-2',type:'Strategy · 6 min',title:'Find the worst-placed piece',description:'A simple improvement question for quiet middlegame positions.',note:'Improve the least active piece; do not force a plan that is not there.',updated:'Starter note'},
    {id:'study-3',type:'Tactics · 5 min',title:'Checks, captures, threats',description:'A repeatable scan for forcing moves before every decision.',note:'List forcing candidates first, then check your opponent’s reply.',updated:'Starter note'}
  ];
  const sampleGames = [
    {id:'demo-1',white:'You',black:'Practice Partner',result:'1-0',date:'2026.10.17',moves:38,opening:'Italian Game',eco:'C50'},

  function freshState(){
    return {
      page:'overview', demo:true,
      profile:{name:'Chess Player',rating:1420,target:1600,focus:'Endgame technique',customized:false},
      progress:{streak:8,sessions:14,minutes:218,puzzles:62,accuracy:72,completedToday:0,lastPracticeDate:'',activity:[]},

      importedGames:[], repertoire:JSON.parse(JSON.stringify(defaultRepertoire)), studies:JSON.parse(JSON.stringify(defaultStudies)),
      moduleFilter:'All', moduleQuery:''
    };
  }
  function loadState(){
    const fresh=freshState();
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(!saved) return fresh;
      return {...fresh,...saved,profile:{...fresh.profile,...(saved.profile||{})},progress:{...fresh.progress,...(saved.progress||{})},tasks:{...fresh.tasks,...(saved.tasks||{})},repertoire:Array.isArray(saved.repertoire)?saved.repertoire:fresh.repertoire,studies:Array.isArray(saved.studies)?saved.studies:fresh.studies,importedGames:Array.isArray(saved.importedGames)?saved.importedGames:[]};
    }catch(_){return fresh;}
  }
  let state=loadState();
  function clearIllustrativeData(){
    if(!state.demo)return;
    state.demo=false;
    state.progress={streak:0,sessions:0,minutes:0,puzzles:0,accuracy:0,completedToday:0,lastPracticeDate:'',activity:[]};
    state.tasks={tactics:false,endgame:false,review:false};
    if(!state.profile.customized){state.profile.rating=null;state.profile.target=null;state.profile.focus='Choose a focus';}
  }
  function recordTrainingScore(score=100){
    const sessions=Math.max(0,Number(state.progress.sessions)||0);
    const previous=Math.max(0,Number(state.progress.accuracy)||0);
    const current=Math.max(0,Math.min(100,Number(score)||0));
    state.progress.accuracy=Math.round(sessions?(previous*sessions+current)/(sessions+1):current);
    const now=new Date();
    const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const last=state.progress.lastPracticeDate;
    if(last!==today){
      const todaySerial=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/86400000;
      const parts=last?last.split('-').map(Number):[];
      const lastSerial=parts.length===3?Date.UTC(parts[0],parts[1]-1,parts[2])/86400000:NaN;
      const elapsed=todaySerial-lastSerial;
      state.progress.streak=last&&elapsed===1?(Number(state.progress.streak)||0)+1:1;
      state.progress.lastPracticeDate=today;
    }
    return today;
  }
  let activeActivity=null;
  let toastTimer=null;
  const $=(selector,root=document)=>root.querySelector(selector);
  const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
  const esc=(value)=>String(value??'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){showToast('Could not save locally. Try exporting your data.');}try{window.SquarewiseCloud?.onLocalChange?.(state);}catch(_){}};
  const initials=(name)=>String(name||'P').trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase()||'P';
  const todayLabel=()=>new Intl.DateTimeFormat('en', {weekday:'long',month:'short',day:'numeric'}).format(new Date()).toUpperCase();
  function showToast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}

  const modules=[
    {id:'tactics',title:'Tactics sprint',cat:'Tactics',icon:'♘',badge:'Daily drill',desc:'Build pattern recognition with short, focused calculation sets.',time:'8 min',level:'Adaptive'},
    {id:'blunder-clinic',title:'Blunder preventer',cat:'Habits',icon:'◎',badge:'High impact',desc:'Practice a reliable scan for your opponent’s checks, captures, and threats.',time:'5 min',level:'From your games'},
    {id:'endgame-lab',title:'Endgame lab',cat:'Technique',icon:'♔',badge:'Skill builder',desc:'Sharpen king activity, pawn races, and practical rook-ending decisions.',time:'10 min',level:'All levels'},
    {id:'openings',title:'Opening repertoire',cat:'Openings',icon:'⌘',badge:'Your lines',desc:'Save, organize, and rehearse the openings you want to play.',time:'5 min',level:'Personalized'},
    {id:'time-trainer',title:'Clock sense',cat:'Habits',icon:'◷',badge:'Time trainer',desc:'Make better choices under time pressure without rushing every move.',time:'4 min',level:'Quick reps'},
    {id:'visualization',title:'Blindfold visualization',cat:'Tactics',icon:'◉',badge:'Visualization',desc:'Hold a position in your mind and calculate without moving pieces.',time:'5 min',level:'No board moves'},
    {id:'conversion',title:'Advantage conversion',cat:'Technique',icon:'↗',badge:'Win the win',desc:'Turn an edge into a full point with calm, purposeful play.',time:'6 min',level:'Practical'},
    {id:'defense',title:'Defensive resourcefulness',cat:'Technique',icon:'⛨',badge:'Find a way',desc:'Create counterplay, active defense, and drawing chances in tough positions.',time:'6 min',level:'Resilience'},
    {id:'intuition',title:'Move intuition',cat:'Tactics',icon:'✦',badge:'Pattern sense',desc:'Train your first read, then verify it with a short calculation check.',time:'4 min',level:'Fast reps'},
    {id:'mate-patterns',title:'Checkmate patterns',cat:'Tactics',icon:'♕',badge:'Pattern library',desc:'Recognize back-rank, corridor, and mating-net ideas before they appear.',time:'5 min',level:'Core patterns'},
    {id:'guess-move',title:'Guess the master move',cat:'Tactics',icon:'…',badge:'Plan finder',desc:'Choose a purposeful continuation from a familiar opening structure.',time:'5 min',level:'Position sense'},
    {id:'opening-improver',title:'Opening improver',cat:'Openings',icon:'↻',badge:'Improve a line',desc:'Review your repertoire, add a note, and set one practical goal per line.',time:'7 min',level:'Spaced review'},
    {id:'game-puzzles',title:'Puzzles from your games',cat:'Games',icon:'♟',badge:'PGN-ready',desc:'Bring your own games into the room and build a personal mistake-to-drill workflow.',time:'Your games',level:'Import PGN'},
    {id:'coach-notes',title:'Coach explanations',cat:'Games',icon:'✎',badge:'Plain language',desc:'Turn a move or recurring theme into a clear lesson and a next action.',time:'3 min',level:'Coach notes'},
    {id:'statistics',title:'My statistics',cat:'Games',icon:'▥',badge:'Progress',desc:'Review your sessions, streak, accuracy, and areas you are working on.',time:'Anytime',level:'Your history'},
    {id:'sparring',title:'Guided sparring',cat:'Technique',icon:'⚔',badge:'Practice partner',desc:'Work through practical decision points against a guided opponent scenario.',time:'6 min',level:'Scenario play'},
    {id:'studies',title:'Studies & practices',cat:'Games',icon:'▣',badge:'Your library',desc:'Keep reusable study notes, plans, and practice reminders in one place.',time:'Saved notes',level:'Personal library'},
    {id:'scouting',title:'Opponent scouting',cat:'Games',icon:'⌕',badge:'Game patterns',desc:'Organize opponent notes and spot trends from the PGNs you import.',time:'Your games',level:'Local review'}
  ];
  const moduleConfig={
    tactics:{type:'board',title:'Knight fork · find the forcing move',subtitle:'White to move. Find a move that checks the king and attacks another valuable piece.',coach:'Look for a knight jump that lands with tempo. The king and queen can both be targets.',success:'Correct — Ne5+ forks the king on d7 and the queen on f7. A forcing move can win material before the opponent has time to regroup.',tag:'TACTICS · 1 POSITION'},
    'blunder-clinic':{type:'choice',title:'Build a blunder-check habit',subtitle:'You are about to make a natural-looking move. What quick scan should come first?',coach:'A short, repeatable checklist is easier to use consistently than vague advice to “be careful.”',options:[['checks','List forcing checks, captures, and threats — then look for the opponent’s reply.'],['fast','Play the first move that feels familiar.'],['attack','Only calculate your own attacking idea.']],correct:'checks',success:'Exactly. A forcing-move scan catches many one-move oversights, and checking the opponent’s reply closes the loop.'},
    'endgame-lab':{type:'choice',title:'Rook ending: activate first',subtitle:'You have a rook and pawn each. Your king is passive, while the opponent’s king is active. What is the practical priority?',coach:'In rook endings, king activity and rook activity often matter more than pushing a pawn immediately.',options:[['king','Improve your king and rook activity before committing the pawn.'],['push','Push the pawn at once, even if the rook is passive.'],['trade','Offer a rook trade without checking the resulting king-and-pawn ending.']],correct:'king',success:'Good technique. Improve the pieces first; only advance when the rook and king can support the passer.'},

  function parsePgn(raw){
    const text=String(raw||'').replace(/\r/g,'').trim();
    if(!text)return [];
    let blocks=text.split(/(?=^\s*\[Event\s)/m).map(b=>b.trim()).filter(Boolean);
    if(!blocks.length)blocks=[text];
    if(blocks.length===1&&!/^\s*\[/m.test(blocks[0]))return [];
    return blocks.slice(0,200).map((block,index)=>{
      const headers={};
      const headerRe=/^\s*\[([A-Za-z0-9_]+)\s+"([^"]*)"\s*\]\s*$/gm;
      let match;while((match=headerRe.exec(block))!==null)headers[match[1]]=match[2];
      let body=block.replace(/^\s*\[[^\]]+\]\s*/gm,' ').replace(/\{[\s\S]*?\}/g,' ').replace(/;[^\n]*/g,' ').replace(/\$\d+/g,' ').replace(/\([^()]*\)/g,' ');
      const resultMatch=body.match(/(?:^|\s)(1-0|0-1|1\/2-1\/2|\*)(?:\s|$)/);
      body=body.replace(/\d+\.{1,3}/g,' ').replace(/1-0|0-1|1\/2-1\/2|\*/g,' ');
      const moves=body.split(/\s+/).filter(token=>token&&!/^\d+\.?$/.test(token)&&token!=='e.p.');
      let date=headers.Date||'';
      if(/^\d{4}\.\d{2}\.\d{2}$/.test(date))date=date.replaceAll('.','-');
      const gameResult=headers.Result||((resultMatch&&resultMatch[1])||'*');
      return {id:`pgn-${Date.now()}-${index}`,white:headers.White||'White',black:headers.Black||'Black',whiteElo:headers.WhiteElo||'',blackElo:headers.BlackElo||'',result:gameResult==='*'?'—':gameResult,date:date||'—',moves:Math.ceil(moves.length/2),plies:moves.length,opening:headers.Opening||(headers.ECO?`ECO ${headers.ECO}`:'Not tagged'),eco:headers.ECO||'',event:headers.Event||'',timeControl:headers.TimeControl||'',pgn:block};
    }).filter(game=>game.white!=='White'||game.black!=='Black'||game.moves>0||game.result!=='—');
  }

      case 'review-opening':{
        const idx=Number(element.dataset.index);const line=state.repertoire[idx];
        activeActivity={id:'opening-improver',config:{type:'choice',tag:'OPENING REVIEW',title:`Review · ${line.name}`,subtitle:`Recall this line: ${line.line}`,coach:line.note||'Say the line out loud, then recall the plan behind it.',options:[['recall','I can recall the main idea and one practical plan.'],['guess','I will memorize the moves without thinking about the position.']],correct:'recall',success:'Nice. Remember both the moves and the idea behind them.'},solved:false,message:'',selectedSquare:'',mistakes:0};renderActivityModal();break;
      }
      case 'add-study':openStudyModal();break;
      case 'edit-study':openStudyModal(element.dataset.id);break;
      case 'save-study':saveStudy(element.dataset.id);break;
      case 'delete-study':if(window.confirm('Remove this study note from the local library?')){state.studies=state.studies.filter(s=>s.id!==element.dataset.id);persist();render();showToast('Study note removed.');}break;
      case 'export-data':exportData();break;
      case 'reset-data':resetData();break;
      case 'complete-session':finishActivity();break;
      case 'submit-answer':{
        const value=($('#activity-answer')?.value||'').trim().toLowerCase();
        activeActivity.answer=value;
        if(value===(activeActivity.config.answer||'').toLowerCase()){activeActivity.solved=true;activeActivity.message=activeActivity.config.success;}
        else{activeActivity.mistakes=(Number(activeActivity.mistakes)||0)+1;activeActivity.message='Not quite. Trace the knight’s two L-shaped jumps and try again.';}
        renderActivityModal();break;
      }
      case 'show-hint':if(activeActivity){activeActivity.message=activeActivity.config.coach||'Look for a forcing move.';renderActivityModal();}break;
      case 'clear-games':if(window.confirm('Remove imported PGNs from this local profile?')){state.importedGames=[];state.demo=false;persist();render();showToast('Imported game list cleared.');}break;
      default:window.SquarewiseExtras?.handleAction?.(action,element);break;
    }
  }
  function showHelp(){
    $('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="modal-head"><div><div class="eyebrow">ABOUT THIS BUILD</div><h2 id="help-title">Your private chess room</h2><p>Inspired by modern game-based chess training, built as an original personal workspace.</p></div><button class="icon-button modal-close" data-action="close-modal" aria-label="Close">×</button></div><div class="info-strip"><span class="info-icon">✦</span><div><strong>All 19 training tools are open in this personal edition.</strong>No subscription gates or paid feature limits. Cloud accounts are optional.</div></div><p class="small-muted" style="line-height:1.7">Local autosave is always active. Optional cloud sync uses your own Supabase project for profile, progress, tasks, repertoire, study notes, and game-derived drills. Imported PGNs stay on this device and are not uploaded. Stockfish runs locally; read-only public game imports are available for Chess.com and Lichess. An optional Lichess token is used only for that request and is not saved. There is no cloud AI service. Engine lines are computer analysis, not guaranteed coaching.</p><div class="modal-actions"><button class="primary-button" data-action="close-modal">Got it</button></div></section></div>`;
  }
  document.addEventListener('click',(event)=>{
    if(event.target.classList?.contains('modal-backdrop')){closeModal();return;}
    const nav=event.target.closest('[data-page]');
    if(nav){event.preventDefault();setPage(nav.dataset.page);return;}
    const filter=event.target.closest('[data-filter]');
    if(filter){state.moduleFilter=filter.dataset.filter;state.moduleQuery='';render();return;}
    const task=event.target.closest('[data-task]');
    if(task){const id=task.dataset.task;state.tasks[id]=!state.tasks[id];persist();render();return;}
    const choice=event.target.closest('[data-choice]');
    if(choice){checkChoice(choice.dataset.choice);return;}
    const square=event.target.closest('[data-square]');
    if(square&&activeActivity?.config.type==='board'&&!activeActivity.solved){
      const sq=square.dataset.square;
      if(!activeActivity.selectedSquare){if(sq==='c4'){activeActivity.selectedSquare=sq;activeActivity.message='';}else{activeActivity.message='Select the white knight on c4 first.';}}
      else if(activeActivity.selectedSquare==='c4'&&sq==='e5'){activeActivity.solved=true;activeActivity.message=activeActivity.config.success;}
      else if(sq==='c4'){activeActivity.selectedSquare='c4';activeActivity.message='Now choose a destination square.';}
      else{activeActivity.selectedSquare='';activeActivity.mistakes=(Number(activeActivity.mistakes)||0)+1;activeActivity.message='That move does not create the fork. Look for a knight jump that checks the king and attacks the queen.';}
      renderActivityModal();return;
    }
    const actionElement=event.target.closest('[data-action]');
    if(actionElement){handleAction(actionElement.dataset.action,actionElement);return;}
    const module=event.target.closest('[data-module]');
    if(module){openModule(module.dataset.module);return;}
  });
  document.addEventListener('input',(event)=>{
    if(event.target.id==='module-search'){
      const query=event.target.value.toLowerCase().trim();
      $$('.module-card').forEach(card=>{const category=card.dataset.category;const categoryMatch=state.moduleFilter==='All'||state.moduleFilter===category;const queryMatch=!query||card.dataset.search.includes(query);card.style.display=categoryMatch&&queryMatch?'flex':'none';});
      const visible=$$('.module-card').filter(card=>card.style.display!=='none').length;const empty=$('#no-modules');if(empty)empty.style.display=visible?'none':'block';state.moduleQuery=event.target.value;
    }
  });
  document.addEventListener('change',(event)=>{
    if(event.target.id==='pgn-file'){
      const file=event.target.files?.[0];if(!file)return;
      const reader=new FileReader();reader.onload=()=>{const field=$('#pgn-input');if(field)field.value=String(reader.result||'');};reader.onerror=()=>{const err=$('#pgn-error');if(err)err.textContent='Could not read that file. Try pasting the PGN text instead.';};reader.readAsText(file);
    }
  });
  document.addEventListener('keydown',(event)=>{
    if(event.key==='Escape'&&$('#modal-root').innerHTML)closeModal();
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('#global-search')?.focus();}
    if(event.target.id==='global-search'&&event.key==='Enter'){
      const query=event.target.value.trim().toLowerCase();
      const match=modules.find(m=>(m.title+' '+m.desc+' '+m.cat).toLowerCase().includes(query));
      if(match){setPage('training');setTimeout(()=>{const input=$('#module-search');if(input){input.value=query;input.dispatchEvent(new Event('input',{bubbles:true}));}},30);openModule(match.id);}
      else if(query){setPage('training');setTimeout(()=>{const input=$('#module-search');if(input){input.value=query;input.dispatchEvent(new Event('input',{bubbles:true}));}},30);}
    }
  });
  window.SquarewiseAPI={get state(){return state;},render,setPage,showToast,parsePgn,persist,clearIllustrativeData,recordTrainingScore,openPgnModal,get modules(){return modules;}};
  function initialize(){
    if(!Array.isArray(state.repertoire)||!state.repertoire.length)state.repertoire=JSON.parse(JSON.stringify(defaultRepertoire));
    if(!Array.isArray(state.studies))state.studies=JSON.parse(JSON.stringify(defaultStudies));
    render();
  }
  initialize();
})();
</script>
<script src="./squarewise-config.js"></script>
<script src="./app-advanced.js"></script>
<script src="./cloud-sync.js"></script>
</body>
